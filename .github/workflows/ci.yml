name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les tests unitaires
        run: npm test

      - name: Vérifier le build de production
        run: npm run build

      - name: Audit de sécurité des dépendances
        run: npm audit --audit-level=high

  docker:
    name: Validation Docker
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t labo-devops1 .

      - name: Smoke test du conteneur
        run: |
          docker run -d --rm -p 8080:80 --name app-ci labo-devops1
          for i in {1..30}; do
            curl -fsS http://localhost:8080 >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:8080 >/dev/null
          docker stop app-ci